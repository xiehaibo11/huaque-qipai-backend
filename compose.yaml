services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nanbei}
      POSTGRES_USER: ${POSTGRES_USER:-nanbei}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nanbei-local-password}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nanbei} -d ${POSTGRES_DB:-nanbei}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - nanbei-postgres-data:/var/lib/postgresql/data

volumes:
  nanbei-postgres-data:
